<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q4Quiz2</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
	
body{
	margin-top: 30px;
	margin-bottom: 30px;
	background-color: floralwhite;
	font-family: Yu Gothic;
}

h1{
	font-family: forte;
	color: rosybrown;
}

#Fil{
	background-image: linear-gradient(saddlebrown, orange);
}

#Eng{
	background-image: linear-gradient(mediumvioletred, palevioletred);
}

#Mat{
	background-image: linear-gradient(royalblue, lightskyblue);
}


</style>

</head>
<body>

<center>
<h1> Subject Score Inspection </h1>
<span style="color: rosybrown;">
<details ontoggle="Clicks()">
<summary>Click !</summary>
<i id="Clicks"></i></details></span>
<br><br>	
<center>
<div class="row justify-content center">
<div class="col-md-4">
<h3><span style="color: saddlebrown;">Filipino</h3></span>
<br>
<img src="https://static.wikia.nocookie.net/philippines/images/4/48/Noli-Me-Tangere.png/revision/latest?cb=20240330055747" style="width: 200px; height: 270px;">
<br><br>
<input type="number" id="Fil" class="form-control" style="width: 200px;">
</div>

<div class="col-md-4">
<h3><span style="color: mediumvioletred;">English</h3></span>
<br>
<img src="https://cdn.kobo.com/book-images/002f669b-cc2e-4ccf-b78e-c969d456620c/1200/1200/False/wuthering-heights-124.jpg" style="width: 200px; height: 270px;">
<br><br>
<input type="number" id="Eng" class="form-control" style="width: 200px;">
</div>

<div class="col-md-4">
<h3><span style="color: royalblue;">Math</h3></span>
<br>
<img src="https://www.phoenix.com.ph/wp-content/uploads/2024/08/RM-9-BBB-TB-1E-Christie-Villanueva-666x1024.jpg" style="width: 200px; height: 270px;">
<br><br>
<input type="number" id="Mat" class="form-control" style="width: 200px;">
</div>
</div>

<br><br>
<button type="Submit" class="btn btn-success" onclick="Grading()">Grader</button>
<br><br>
<small> @Sofia Ng | <a href="ICTSourcesQ4Q2.pdf"> Sources </a></small>
</center>
<script>

function Clicks (){ //This function is used for the instructions to generate it for the user.
	document.getElementById("Clicks").innerHTML = "Input your grades in their respective subjects."; //This is to display the instructions to the user.
}

function Grading () { //This function is used for the button to generate the user their average grade and classification. 
var Fili = Number(document.getElementById("Fil").value); //This is used to get the value inputed in the Filipino subject category.
var Engl = Number(document.getElementById("Eng").value); //This is used to get the value inputed in the English subject category.
var Mats = Number(document.getElementById("Mat").value); //This is used to get the value inputed in the Mathematics subject category.
var Avg = (Fili + Engl + Mats)/3; //This is used to get the average grade.
var Roun = Math.round(Avg); //This is to round up the value.
var Gradi = Roun.toFixed(2); //This is to make the value have two decinale places.

if (Gradi >= 94.00 && Gradi <= 100.00) {
window.alert("Your average is " + Gradi + " - Excellent. Great Job!");
} //In the case the user's average grade is 94-100, then they will be alerted via window indicating their average grade and the classification being "excellent", with the comment "Great job!".

else if (Gradi >= 87.00 && Gradi <= 93.99) {
window.alert("Your average is " + Gradi + " - Above Satisfactory. Nice!");
} //In the case the user's average grade is 87-93, then they will be alerted via window indicating their average grade and the classification being "above satisfactory", with the comment "Nice!".

else if (Gradi >= 80.00 && Gradi <= 86.99) {
window.alert("Your average is " + Gradi + " - Satisfactory. You did well!");
} //In the case the user's average grade is 80-86, then they will be alerted via window indicating their average grade and the classification being "satisfactory", with the comment "You did well!".

else if (Gradi >= 75.00 && Gradi <= 79.99) {
window.alert("Your average is " + Gradi + " - Needs Improvement. You can do this!");
} //In the case the user's average grade is 75-79, then they will be alerted via window indicating their average grade and the classification being "needs improvement", with the comment "You can do this!".

else {
window.alert("Your average is " + Gradi + " - Poor. Don't be discouraged!"); //If the user's average grade is anything else than the specified conditions, then they will be alerted via window indicating their average grade and the classification being "poor", with the comment "Don't be discouraged!".
}

}

</script>
 
</body>
